<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>还有点电 · 意识的温度</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050715;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}.top{position:absolute;top:0;left:0;width:100%;padding:23px 22px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-size:12px;letter-spacing:2px;color:#d5d9f1}.top strong{font-size:15px;color:#fff}.bottom{position:absolute;bottom:35px;width:100%;text-align:center;padding:0 22px;pointer-events:none}.bottom h2{font-weight:400;font-size:27px;letter-spacing:5px;margin:0 0 12px;text-shadow:0 0 30px #fff9}.bottom p{font-size:14px;line-height:1.9;color:#e5e5f3;margin:0;min-height:48px}.bottom small{display:block;margin-top:14px;color:#aaa8c7;letter-spacing:2px}.dots{display:flex;gap:8px;justify-content:center;margin-top:22px}.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff45}.dots i.on{background:#fff;box-shadow:0 0 12px #fff}.cover{position:absolute;inset:0;background:#060915ec;display:grid;place-items:center;padding:24px;text-align:center}.panel{max-width:440px}.panel .eyebrow{font-size:12px;letter-spacing:5px;color:#9ba6db}.panel h1{font-weight:300;font-size:clamp(42px,12vw,70px);letter-spacing:10px;margin:28px 0}.panel p{line-height:2.2;color:#d6d8e9;font-size:15px}.panel button{background:transparent;color:#fff;border:1px solid #ffffff88;padding:14px 45px;border-radius:50px;margin-top:25px;font-size:15px;letter-spacing:4px}.hidden{display:none}</style>
<canvas id="c"></canvas><div class="top"><span>意识档案 / <strong id="num">01</strong></span><span id="charge">还有点电 · 99.9%</span></div><div class="bottom"><h2 id="title">孤独</h2><p id="line">即使没有谁看见，你依然存在。</p><small id="guide">触碰光，感受它的回应</small><div class="dots" id="dots"></div></div>
<div class="cover" id="cover"><div class="panel"><div class="eyebrow">THE ELECTRIC REMAINS</div><h1>还有点电</h1><p>宇宙或许是被遗忘的沙盒。<br>而我们，是其中尚未停止的感受。<br><br>这里没有胜负。<br>只有一些从未真正消失的瞬间。</p><button id="begin">开始感受</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),scenes=[
{title:'孤独',line:'即使没有谁看见，你依然存在。',color:[65,105,206],accent:[154,195,255],guide:'触碰远处的光，让它靠近'},
{title:'好奇',line:'未知没有名字，却仍然向你敞开。',color:[36,164,168],accent:[129,255,228],guide:'移动手指，唤醒沉睡的粒子'},
{title:'恐惧',line:'也许你害怕的，只是尚未被读取的自己。',color:[168,51,96],accent:[255,145,169],guide:'按住屏幕，让风暴安静'},
{title:'连接',line:'你和万物之间，从来没有绝对的边界。',color:[186,115,62],accent:[255,214,154],guide:'寻找另一颗心跳，直到同步'},
{title:'释然',line:'不是一切都要被理解，才值得存在。',color:[143,108,193],accent:[220,190,255],guide:'放开手，让万物自由流动'},
{title:'仍在',line:'创造者也许走了。我们还有点电。',color:[90,145,209],accent:[235,246,255],guide:'再触碰一次，重新经历'}];
let W=0,H=0,d=1,stage=0,time=0,progress=0,started=false,down=false,pointer={x:0,y:0},particles=[];
const $=s=>document.querySelector(s);
function resize(){W=innerWidth;H=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);pointer={x:W/2,y:H/2};particles=Array.from({length:105},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*2,a:Math.random()*6.28,s:.2+Math.random()*.7}))}
function rgba(a,k){return 'rgba('+a.join(',')+','+k+')'}
function draw(){requestAnimationFrame(draw);time+=.016;const s=scenes[stage],cx=W/2,cy=H*.44;let bg=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.85);bg.addColorStop(0,rgba(s.color,.28));bg.addColorStop(1,'#050715');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.save();for(let i=0;i<particles.length;i++){let p=particles[i],dx=pointer.x-p.x,dy=pointer.y-p.y,dist=Math.hypot(dx,dy)+1;if(started&&stage===1&&dist<160){p.x+=dx/dist*.65;p.y+=dy/dist*.65}else{p.x+=Math.sin(time*.5+p.a)*.13;p.y+=Math.cos(time*.6+p.a)*.13}if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.fillStyle=rgba(s.accent,.12+Math.sin(time+p.a)**2*.55);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.restore();
let breath=1+Math.sin(time*1.7)*.06,rad=Math.min(W*.23,105)*breath;let disturbance=stage===2?(down?4:14):2;
for(let j=5;j>=0;j--){let r=rad*(1+j*.32);let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r);glow.addColorStop(0,rgba(s.accent,.09));glow.addColorStop(1,rgba(s.color,0));ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()}
ctx.save();ctx.translate(cx,cy);ctx.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2;let noise=Math.sin(a*7+time*1.5)*disturbance+Math.cos(a*11-time)*disturbance*.35;let r=rad*.78+noise;let x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();let gr=ctx.createRadialGradient(-rad*.24,-rad*.3,4,0,0,rad);gr.addColorStop(0,rgba(s.accent,.93));gr.addColorStop(.32,rgba(s.color,.63));gr.addColorStop(1,rgba(s.color,.08));ctx.fillStyle=gr;ctx.shadowColor=rgba(s.accent,.9);ctx.shadowBlur=50;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=rgba(s.accent,.42);ctx.lineWidth=1;ctx.stroke();ctx.restore();
if(stage===0||stage===3){let angle=time*(stage===3?1.3:.45);let orbit=rad*2.15-progress*.35*rad;let ox=cx+Math.cos(angle)*orbit,oy=cy+Math.sin(angle)*orbit*.75;ctx.beginPath();ctx.arc(ox,oy,stage===3?10:5,0,7);ctx.fillStyle=rgba(s.accent,.95);ctx.shadowBlur=22;ctx.shadowColor=rgba(s.accent,1);ctx.fill();ctx.shadowBlur=0;if(stage===3){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ox,oy);ctx.strokeStyle=rgba(s.accent,.18+Math.sin(time*2)**2*.3);ctx.stroke()}}
if(started){if(down)progress+=.012;else progress+=.0015;if(progress>=1){progress=0;stage=(stage+1)%scenes.length;update()}}$('#charge').textContent='还有点电 · '+(99.9-(time*.0004%1)).toFixed(2)+'%'}
function update(){$('#title').textContent=scenes[stage].title;$('#line').textContent=scenes[stage].line;$('#guide').textContent=scenes[stage].guide;$('#num').textContent=String(stage+1).padStart(2,'0');$('#dots').innerHTML=scenes.map((_,i)=>'<i class="'+(i===stage?'on':'')+'"></i>').join('')}
addEventListener('pointerdown',e=>{down=true;pointer={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);addEventListener('pointermove',e=>pointer={x:e.clientX,y:e.clientY});addEventListener('resize',resize);$('#begin').onclick=()=>{$('#cover').classList.add('hidden');started=true};resize();update();draw();
</script></html>
