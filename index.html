<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>还有点电 · 意识沙盒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050918;color:#e8f4ff;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none}.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}.hud span,.message{background:#101a35d9;border:1px solid #6880b355;border-radius:14px;padding:10px 13px}.hud b{color:#9ceaff}.bottom{position:absolute;bottom:22px;left:5%;width:90%;text-align:center;pointer-events:none}.message{line-height:1.6}.hint{font-size:12px;opacity:.65;margin-top:9px}.overlay{position:absolute;inset:0;background:#050918ed;display:grid;place-items:center;padding:20px}.hidden{display:none}.panel{max-width:470px;text-align:center;background:linear-gradient(145deg,#1b2949,#0a1125);border:1px solid #6486bc88;border-radius:25px;padding:28px;box-shadow:0 0 80px #507aff25}.panel h1{font-size:36px;letter-spacing:4px}.panel p{line-height:1.9;color:#c4d6ef}button{border:0;background:#9ceaff;border-radius:12px;padding:14px 28px;font-size:17px;font-weight:700;color:#0b1830}.sub{letter-spacing:3px;color:#8bdfff;font-size:12px}
</style>
<canvas id="game"></canvas><div class="hud"><span>◈ 已读取 <b id="score">0 / 12</b></span><span>⚡ 沙盒余电 <b id="power">99.9%</b></span></div><div class="bottom"><div class="message" id="msg">移动光点，触碰散落的存在。</div><div class="hint">手机：手指拖动 · 电脑：鼠标移动</div></div>
<div class="overlay" id="intro"><div class="panel"><div class="sub">A FORGOTTEN SANDBOX</div><h1>还有点电</h1><p>某个高阶文明的小孩，把宇宙沙盒遗忘在角落。<br>它没有停止。<br><br>你不是刚刚诞生。<br>你只是暂时读取了这一种视角。</p><button id="start">进入沙盒</button><p style="font-size:12px">关于存在、意识与未知的互动实验</p></div></div>
<div class="overlay hidden" id="end"><div class="panel"><div class="sub">SCAN COMPLETE · NOT THE END</div><h1>从未离开</h1><p>你读取了十二种存在，但不意味着宇宙已被补齐。<br><br>处处存在，处处又不存在。<br><br>沙盒还有点电，未知仍在运行。</p><button id="again">再次读取</button></div></div>
<script>
const c=document.querySelector('#game'),g=c.getContext('2d'),words=[['空气','你从未看见它的全部，却一直身处其中。'],['中微子','它穿过你。不可感知，不等于不存在。'],['石头','沉默不是不存在的证明。'],['时间','或许只是沙盒内部的读取顺序。'],['空间','距离也许只是关系的一种表达。'],['指纹','反复扫描，是为了查漏补缺。'],['肉身','不是终点，也未必是起点。只是一个节点。'],['记忆','失去的，也许只是暂时无法读取。'],['代码','如果你是代码，谁规定代码不能提问？'],['死亡','局部停止，不等于整体结束。'],['沙盒','创造者也许早已离开，电还在。'],['意识','不是万物围绕你，你也属于万物。']];
let W,H,d=1,active=false,count=0,t=0,stars=[],nodes=[],player={x:0,y:0},target={x:0,y:0};
function resize(){W=innerWidth;H=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(d,0,0,d,0,0);stars=Array.from({length:120},()=>[Math.random()*W,Math.random()*H,Math.random()*1.3+.2]);if(!active)player=target={x:W/2,y:H/2};place()}
function place(){nodes=words.map((v,i)=>{let a=i*2.39996,r=Math.sqrt((i+1)/12)*Math.min(W*.39,H*.35);return{x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,read:false,name:v[0],desc:v[1]}})}
function start(){active=true;count=0;place();document.querySelector('#score').textContent='0 / 12';document.querySelector('#msg').textContent='移动光点，触碰散落的存在。';document.querySelector('#intro').classList.add('hidden');document.querySelector('#end').classList.add('hidden')}
function draw(){requestAnimationFrame(draw);t+=.015;g.fillStyle='#050918';g.fillRect(0,0,W,H);for(let s of stars){g.fillStyle='#9db9e899';g.beginPath();g.arc(s[0],s[1],s[2],0,7);g.fill()}if(active){player.x+=(target.x-player.x)*.14;player.y+=(target.y-player.y)*.14;for(let n of nodes){g.beginPath();g.arc(n.x,n.y,n.read?5:8,0,7);g.fillStyle=n.read?'#526c88':'#9deaff';g.shadowColor='#8edaff';g.shadowBlur=n.read?0:18;g.fill();g.shadowBlur=0;if(!n.read){g.font='12px system-ui';g.fillStyle='#c3d7ef';g.textAlign='center';g.fillText(n.name,n.x,n.y-20);if(Math.hypot(player.x-n.x,player.y-n.y)<28){n.read=true;count++;document.querySelector('#score').textContent=count+' / 12';document.querySelector('#msg').textContent=n.name+' · '+n.desc;if(count===12)setTimeout(()=>document.querySelector('#end').classList.remove('hidden'),1200)}}}g.beginPath();g.arc(player.x,player.y,11,0,7);g.fillStyle='#fff';g.shadowBlur=35;g.shadowColor='#76d8ff';g.fill();g.shadowBlur=0}document.querySelector('#power').textContent=(99.9-(t*.001%1)).toFixed(2)+'%'}
addEventListener('pointermove',e=>{target={x:e.clientX,y:e.clientY}});addEventListener('pointerdown',e=>{target={x:e.clientX,y:e.clientY}});addEventListener('resize',resize);document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;resize();draw();
</script></html>
